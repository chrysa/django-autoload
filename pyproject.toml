[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-autoload"
version = "0.1.0"
description = "Convention-over-configuration auto-discovery for Django: apps, urls, settings and app components."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Anthony Gréau", email = "greau.anthony@gmail.com" }]
keywords = ["django", "autodiscover", "autoload", "convention", "settings"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
celery = ["celery>=5.3"]
rq = ["rq>=1.10"]
django-rq = ["django-rq>=2.5"]
test = ["pytest", "pytest-cov>=5.0", "pytest-django", "djangorestframework>=3.14", "celery>=5.3", "rq>=1.10", "django-rq>=2.5"]

[project.urls]
Homepage = "https://github.com/chrysa/django-autoload"
Issues = "https://github.com/chrysa/django-autoload/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_autoload*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=django_autoload --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["django_autoload"]
omit = ["**/tests/**"]
# Emit repo-relative file paths in coverage.xml so SonarCloud can map them
# to source files (otherwise paths are absolute and resolve to nothing).
relative_files = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
# examples/ holds illustrative demo Django apps, not library code.
extend-exclude = ["examples", ".claude", "scripts/quality_gate.py"]

[tool.ruff.lint]
select = [
    "C901",
    "PERF203",
    "PERF401",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "RUF005",
    "RUF006",
    "RUF007",
    "RUF009",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF043",
    "RUF059",
    "RUF100",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]
"**/conftest.py" = ["PLR2004"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "alembic", ".venv", ".claude"]
